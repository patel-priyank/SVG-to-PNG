<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
    <title>SVG to PNG Converter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/8.0.4/babel.min.js"></script>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css"
    />
    <link rel="stylesheet" type="text/css" href="./style.css" />
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const SVGToPNGConverter = () => {
        const [isDarkMode, setIsDarkMode] = React.useState(false);
        const [svgCode, setSvgCode] = React.useState('');
        const [width, setWidth] = React.useState('512');
        const [height, setHeight] = React.useState('512');
        const [pngDataUrl, setPngDataUrl] = React.useState(null);
        const [error, setError] = React.useState('');

        React.useEffect(() => {
          const savedTheme = localStorage.getItem('svg-to-png-theme');

          setIsDarkMode(
            savedTheme ? JSON.parse(savedTheme) : window.matchMedia('(prefers-color-scheme: dark)').matches
          );
        }, []);

        React.useEffect(() => {
          document.body.classList.toggle('dark', isDarkMode);
        }, [isDarkMode]);

        const toggleTheme = () => {
          localStorage.setItem('svg-to-png-theme', !isDarkMode);
          setIsDarkMode(!isDarkMode);
        };

        const convertSVGToPNG = () => {
          setPngDataUrl(null);
          setError('');

          try {
            if (!svgCode.trim()) {
              setError('Enter SVG code to convert');
              return;
            }

            const w = Number(width);
            const h = Number(height);

            if (!Number.isFinite(w) || !Number.isFinite(h) || w < 1 || h < 1) {
              setError('Width and height must be greater than 0');
              return;
            }

            const svg = new Blob([svgCode], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(svg);

            const img = new Image();

            img.onerror = () => {
              URL.revokeObjectURL(url);
              setError('Invalid SVG: unable to load image');
            };

            img.onload = () => {
              try {
                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');

                const scale = Math.min(w / img.width, h / img.height);
                const scaledWidth = img.width * scale;
                const scaledHeight = img.height * scale;
                const x = (w - scaledWidth) / 2;
                const y = (h - scaledHeight) / 2;

                ctx.drawImage(img, x, y, scaledWidth, scaledHeight);
                setPngDataUrl(canvas.toDataURL('image/png'));

                URL.revokeObjectURL(url);
              } catch (e) {
                URL.revokeObjectURL(url);
                setError('Error converting SVG: ' + e.message);
              }
            };

            img.src = url;
          } catch (e) {
            setError('Conversion error: ' + e.message);
          }
        };

        const downloadPNG = () => {
          if (pngDataUrl) {
            const link = document.createElement('a');
            link.download = 'image.png';
            link.href = pngDataUrl;
            link.click();
          }
        };

        return (
          <main>
            <div className="toolbar">
              <button
                onClick={toggleTheme}
                aria-label={isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'}
                title={isDarkMode ? 'Light mode' : 'Dark mode'}
              >
                <i className={isDarkMode ? 'ph-bold ph-sun' : 'ph-bold ph-moon'}></i>
              </button>

              <a
                href="https://github.com/patel-priyank/SVG-to-PNG"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="View source code on GitHub"
                title="Source code"
              >
                <i className="ph-bold ph-code"></i>
              </a>
            </div>

            <section className="hero">
              <span className="badge">
                <i className="ph-bold ph-lightning"></i>
                <span>Runs entirely in your browser</span>
              </span>

              <h1>
                SVG to{' '}
                <span className="no-break">
                  <span className="mark">PNG</span>,
                </span>{' '}
                instantly
              </h1>

              <p>
                Paste your SVG markup, pick a size, and get a crisp PNG back. No uploads, no accounts, no waiting
                around.
              </p>
            </section>

            <section className="editor">
              <label className="field-label" htmlFor="svg-code">
                SVG Code
              </label>

              <textarea
                id="svg-code"
                name="svg-code"
                value={svgCode}
                onChange={e => setSvgCode(e.target.value)}
                placeholder='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">...</svg>'
                spellCheck="false"
                className="svg-code"
              />
            </section>

            <section className="controls">
              <div className="size-inputs">
                <label>
                  <span className="field-label">Width</span>

                  <span className="input-wrap">
                    <input
                      type="number"
                      name="width"
                      min="1"
                      value={width}
                      onChange={e => setWidth(e.target.value)}
                      placeholder="512"
                    />

                    <span className="unit">px</span>
                  </span>
                </label>

                <label>
                  <span className="field-label">Height</span>

                  <span className="input-wrap">
                    <input
                      type="number"
                      name="height"
                      min="1"
                      value={height}
                      onChange={e => setHeight(e.target.value)}
                      placeholder="512"
                    />

                    <span className="unit">px</span>
                  </span>
                </label>
              </div>

              <div className="actions">
                <button className="btn-primary" onClick={convertSVGToPNG}>
                  <i className="ph-bold ph-arrows-clockwise"></i>
                  <span>Convert</span>
                </button>

                <button className="btn-secondary" onClick={downloadPNG} disabled={!pngDataUrl}>
                  <i className="ph-bold ph-download-simple"></i>
                  <span>Download</span>
                </button>
              </div>
            </section>

            <section className="preview">
              <span className="field-label">Preview</span>

              <div className="preview-content">
                {error ? (
                  <p className="error">
                    <i className="ph-bold ph-warning-circle"></i>
                    <span>{error}</span>
                  </p>
                ) : pngDataUrl ? (
                  <img src={pngDataUrl} alt="Converted PNG preview" />
                ) : (
                  <p className="placeholder">
                    <i className="ph-bold ph-image"></i>
                    <span>Your PNG will appear here</span>
                  </p>
                )}
              </div>
            </section>
          </main>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<SVGToPNGConverter />);
    </script>
  </body>
</html>
